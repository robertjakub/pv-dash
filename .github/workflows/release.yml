name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  test:
    name: the suites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - cache-regtest.py
          - scrape-regtest.py
          - cache-stress.py
          - cache-control-fuzz.py
          - control-fuzz.py
          - dashboard-control-fuzz.py
          - cache-fuzz.py 300
          - scrape-fuzz.py 300
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/${{ matrix.suite }}

  build:
    name: nix build (all four packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix flake check --no-build || true
          nix build .#modbus-cache .#modbus-scraper .#modbus-fake-inverter .#dashboard --no-link

  sbom:
    name: the SBOM, checked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/gen_sbom.py --check

  release:
    name: the GitHub release
    needs: [test, build, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: extract the changelog section
        run: |
          python3 - "$GITHUB_REF_NAME" > body.md <<'EOF'
          import re, sys
          v, text = sys.argv[1], open('CHANGELOG.md').read()
          m = re.search(r'^## %s[^\n]*\n(.*?)(?=^## |\Z)' % re.escape(v), text, re.M | re.S)
          print(m.group(1).strip() if m else 'pv-suite %s' % v)
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: pv-suite ${{ github.ref_name }}
          body_path: body.md
          fail_on_unmatched_files: false
