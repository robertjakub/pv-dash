# The modbus-cache's example configuration — GENERATED by
# dev/generators/examples.py from cache/lib/options.json (the
# one-knob-one-source rows): every knob the registry declares is below — 52
# of them, every line commented. Edit the registry and re-run the generator,
# never this file. The dev wrapper (`apps/cache/dev`) points --config here;
# the docker image copies the file to /pv-suite/cache/modbus-cache.conf —
# its default --config target — where the CMD flags and the env twins carry
# the deployment shape. Copy the file, uncomment what you change.

# The grammar is the control grammar: every line is a `set <name> <value>` —
# the live path as words, the same line pastes into the console or a ctl —
# and every comment stays a comment. A value resolves flag > env > this file
# > the row's default: anything left commented falls to the default the line
# spells. A secret's line spells the file:<path> form — pass it as an
# owner-only 0600 file, never inline.

# per-register cache TTL: older entries are refetched
# set cache ttl 30

# --- modbus ---

# the Modbus sessions: the inverter endpoint, the unit id, the poll plan,
# the map, the auth schemes both directions

# the inverter Modbus TCP endpoint HOST:PORT (`:5502` = 127.0.0.1:5502)
# startup-only: a change applies on restart
# set modbus upstream 127.0.0.1:5502

# the Modbus unit id the session speaks
# set modbus unit 1

# Modbus connect/read timeout in seconds
# set modbus timeout 3

# the Modbus auth scheme: suite (the crypt handshake) or none
# no auth (the default)
# set modbus auth none

# the suite handshake's shared key for the cache's clients, min 16
# characters (`file:<path>` reads an owner-only file)
# a secret — pass it as file:<path>, an owner-only 0600 file
# startup-only: a change applies on restart
# set modbus auth key file:/run/credentials/modbus-cache/modbus-auth-key

# the auth scheme the cache speaks to the upstream inverter: suite (the
# crypt handshake), waveshare (the gateway connection password) or none
# no auth (the default)
# set modbus auth-upstream none

# the key the cache presents upstream: the suite handshake's shared key (min
# 16 characters) or the Waveshare gateway password (`file:<path>` reads an
# owner-only file)
# a secret — pass it as file:<path>, an owner-only 0600 file
# startup-only: a change applies on restart
# set modbus auth-upstream-key file:/run/credentials/modbus-cache/modbus-auth-upstream-key

# seconds between polls of the upstream
# set modbus interval 10

# seconds between consecutive device reads within a poll cycle
# set modbus read-delay 0.05

# max register gap when merging ranges into block reads; the plan rebuilds
# set modbus merge-gap 8

# device profile JSON (a bare name resolves in shared/profiles/)
# set modbus profile sun2000

# selection JSON: which profile names to fetch ("all" = every entry, "none"
# = cache nothing)
# every profile entry (the default)
# set modbus selection all

# --- write ---

# the write gates: the forwarding toggle and the register ranges

# forward write requests (FC05/06/15/16/22/23) to the device
# refuse writes with a Modbus illegal-function exception (the default)
# set write allow false

# the address ranges a write may touch (FC06/16/22/23 registers, FC05/15
# coils): START:COUNT,... or the device profile's acl
# no register writable (the default)
# set write registers none

# --- acl ---

# the access-control lists: who may connect, who may write

# clients allowed to connect: "any", "none", comma-separated IPs/prefixes,
# or file:<path> (the ip-prefix acl file)
# every client may connect (the default)
# set acl connect any

# clients allowed to write (requires allow-write): "any", "none",
# comma-separated IPs/prefixes, or file:<path> (the ip-prefix acl file)
# no client may write (the default)
# set acl write none

# --- system ---

# the daemon's own socket and client log: the listen address, the access-log
# verbosity

# listen address HOST:PORT
# startup-only: a change applies on restart
# set system listen 127.0.0.1:15502

# log timestamps in the system time zone instead of UTC
# log timestamps in UTC (the default)
# set system local-time false

# DEBUG-log the full output of every control command (plainly: the command
# and its status log)
# set system log-replies false

# log verbosity
# lifecycle, control commands, writes
# set system log-level INFO

# log client connects/disconnects at INFO instead of DEBUG
# set system log-access false

# --- limits ---

# the connection caps: the simultaneous-client and per-IP limits

# simultaneous client limit
# set limits max-clients 64

# disconnect clients silent for this long
# set limits client-timeout 300

# simultaneous connections from one peer IP
# no per-IP limit (the default)
# set limits max-conn-per-ip 0

# --- control ---

# the control plane: the target, the tokens, the ops role's RBAC policy, the
# trusted peers

# control server target: unix socket path or TCP port on 127.0.0.1
# PATH|PORT
# set control port

# require a token on control connections: the client authenticates with
# {"cmd": "auth", "token":...}; over the unix socket a trusted peer (root,
# the daemon's own user or --control-trust-uids — SO_PEERCRED) skips the
# token (`file:<path>` = the token from an owner-only file)
# a secret — pass it as file:<path>, an owner-only 0600 file
# startup-only: a change applies on restart
# set control token file:/run/credentials/modbus-cache/control-token

# extra peer uids the unix control socket trusts without the token
# (SO_PEERCRED — a local systemd unit speaks without the secret); root and
# the daemon's own user are always trusted
# UID,...
# set control trust-uids

# leave the unix control socket group-accessible (chmod 0660 instead of the
# plain 0600)
# set control socket-group false

# --- control/ops ---

# the read-only ops role: the second token that scopes its sessions to the
# configured verbs (the default: show,flush)

# a second, read-only control token: sessions authenticating with it may run
# its policy's verbs only (the default policy: show,flush) (no set/clear, no
# request poll now, no request dump/restore, no restart, no shutdown) — the
# ops shift against the admin key, both audited (`file:<path>` = the token
# from an owner-only file)
# a secret — pass it as file:<path>, an owner-only 0600 file
# startup-only: a change applies on restart
# set control ops token file:/run/credentials/modbus-cache/control-ops-token

# the read-only ops role's RBAC policy: the verbs its sessions may run,
# comma-separated
# set control ops verbs show,flush

# --- metrics ---

# the cache's own Prometheus /metrics endpoint: the toggle, the bind
# address, the bearer token and the connection caps

# the tool's own Prometheus /metrics endpoint (needs a token beyond
# loopback; the address is --metrics-listen)
# no metrics endpoint (the default)
# set metrics enable false

# the metrics bind address HOST:PORT — the set records the value, the
# restart (request reload) applies it
# startup-only: a change applies on restart
# set metrics listen 127.0.0.1:9351

# the metrics bearer token (Authorization: Bearer) — startup-only (pass it
# by flag/env/config); the value never renders back (`file:<path>` = the
# token from an owner-only file)
# a secret — pass it as file:<path>, an owner-only 0600 file
# startup-only: a change applies on restart
# set metrics token file:/run/credentials/modbus-cache/metrics-token

# clients allowed to connect to /metrics: "any", "none", comma-separated
# IPs/prefixes, or file:<path> (the ip-prefix acl file)
# every client may connect (the default)
# set metrics acl any

# --- metrics/limits ---

# the metrics endpoint's connection caps: the simultaneous-client and per-IP
# limits

# maximum concurrent /metrics clients; extras get an immediate 503, 0 =
# unlimited
# set metrics limits max-clients 64

# seconds an idle /metrics client is kept before the socket times out, 0 =
# the built-in 5 s cap
# set metrics limits timeout 5

# maximum concurrent /metrics connections from one peer IP, 0 = no per-IP
# limit
# no per-IP limit (the default)
# set metrics limits max-conn-per-ip 0

# --- audit ---

# the audit trail: the sink, the forwarding, the rotation, the kill switch

# the audit trail's file: a path, - for stdout, none = no local file (the
# forward carries the trail), empty = the XDG state home
# PATH|-|none
# set audit log-file

# also forward every audit line: the local syslog mirror or a remote
# collector (the off-box copy)
# set audit forward none

# the remote forward's envelope: RFC5424 (the default) or CEF — the local
# syslog forms keep the verbatim send
# the syslog envelope, the native line verbatim in the MSG
# set audit forward format rfc5424

# the audit lines' instance word: the writer daemon's identity — the control
# port when unset, the override when spelled
# ID
# set audit instance

# disable the audit trail entirely
# set audit disable false

# audit one REQUESTS tally per client per this many seconds
# set audit requests 300

# --- audit/rotate ---

# the audit trail's rotation: the size trigger, the UTC-midnight trigger and
# the backup count

# rotate the audit trail at this size in MB, keeping N backups; 0 = no size
# rotation
# set audit rotate max-size 10

# also rotate the audit trail at UTC midnight
# set audit rotate daily false

# rotated audit backups to keep
# set audit rotate files 3

# --- dump ---

# the state dump: the path, the cache words, the restore-on-start

# the state dump file: written behind, on request dump and every
# dump-interval
# <file>
# set dump path

# the key that seals the state dumps (the words and the settings, the
# reload's state file too) (`file:<path>` reads an owner-only file)
# a secret — pass it as file:<path>, an owner-only 0600 file
# startup-only: a change applies on restart
# set dump key file:/run/credentials/modbus-cache/dump-key

# the dump carries the cached register words too
# set dump with-cache false

# seconds between the automatic state dumps (the live setting overrides)
# set dump interval 0

# the dump loads on start (off: on demand with request restore)
# startup-only: a change applies on restart
# set dump restore-on-start false
