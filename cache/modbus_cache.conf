# modbus-cache configuration — the control grammar (common/options.py):
# every line is a `set <name> <value>` in the CLI spelling — the live path
# as words, the same line pastes into the console or cache_ctl — and every
# comment stays a comment. The resolution order is flag > env > this file >
# the built-in defaults; anything left commented falls to its default. The
# flat dashed knob name (`set upstream <value>`) reads too, for older files.

# the inverter Modbus session: the endpoint, the unit id, the poll plan
# (upstream is restart-marked in the registry: a change applies on reload)
set modbus upstream 127.0.0.1:5502
set modbus unit 1
set modbus timeout 3
set modbus interval 10
set modbus read-delay 0.05
set modbus merge-gap 8
# set modbus profile sun2000   (a bare name resolves in profiles/profiles/)
# set modbus selection all     (a selection JSON path, all, or none)
# set cache ttl off            (seconds or off; default: the profile's ages)

# the listen address and the log clock
set listen 127.0.0.1:15502
set local-time false

# the write gates: the forwarding toggle and the register ranges
set write allow false
set write registers none

# the access-control lists: who may connect, who may write
set acl connect any
set acl write none

# the connection caps: the simultaneous-client and per-IP limits
set limits max-clients 64
set limits client-timeout 300
set limits max-conn-per-ip 0

# the control plane: the target, the tokens, the ops role's RBAC policy
# set control port             (unix path, TCP port on 127.0.0.1, or 0 = off)
# set control token file:/run/credentials/modbus-cache/control-token
# set control ops token file:/run/credentials/modbus-cache/control-ops-token
set control ops-verbs show,clear
# set control trust-uids       (extra peer uids the unix socket trusts)
set control socket-group false

# the own Prometheus /metrics endpoint
set metrics enable false
set metrics listen 127.0.0.1:9252
# set metrics token file:/run/credentials/modbus-cache/metrics-token
set metrics limits max-clients 64
set metrics limits timeout 5
set metrics limits max-conn-per-ip 0

# the audit trail: the sink, the rotation, the kill switch
# set audit log-file           (a path or - for stdout; default: the XDG state home)
set audit rotate max-size 10
set audit rotate daily false
set audit rotate files 3
set audit disable false
set audit requests 300

# the log surface
set log-level INFO
set log-access false

# the state dump: the path, the cache words, the restore-on-start
# set dump path                (the dump file; needs setting for the dump to run)
# set dump key                 (seal the dumps: the state rides encrypted; restart to apply)
set dump with-cache false
# set dump-interval            (seconds between the automatic dumps; 0 = on request)
set dump restore-on-start false
