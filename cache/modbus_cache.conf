# modbus-cache configuration — the control grammar (common/options.py):
# every line is a `set <name> <value>`, every comment stays a comment, and
# the whole file pipes through cache_ctl unchanged (or regenerates with the
# `show config` control command). The resolution order is flag > env > this
# file > the built-in defaults; anything left commented falls to its default.

# --- the device (upstream inverter) and the register map ---
set host 127.0.0.1
set port 5502
set unit 1
set timeout 3
set listen 127.0.0.1:15502
set interval 10
set read-delay 0.05
set merge-gap 8
# set cache-ttl off            (seconds or off; default: the profile's ages)
set allow-write false
set write-registers none
set connect-acl any
set write-acl none
# set profile sun2000          (a bare name resolves in profiles/profiles/)
# set selection all            (a selection JSON path, all, or none)

# --- what the tool serves and where ---
set local-time false

# --- the connection caps ---
set max-clients 64
set client-timeout 300
set max-conn-per-ip 0

# --- the control plane ---
# set control-port             (unix path, TCP port on 127.0.0.1, or 0 = off)
# set control-token-file /run/credentials/modbus-cache/control-token
# set control-ops-token-file /run/credentials/modbus-cache/control-ops-token
set control-ops-verbs show,clear
# set control-trust-uids       (extra peer uids the unix socket trusts)
set control-socket-group false

# --- the own Prometheus /metrics endpoint ---
set metrics-server false
set metrics-listen 127.0.0.1:9252
set metrics-max-clients 64
set metrics-client-timeout 5
set metrics-max-conn-per-ip 0

# --- the audit trail ---
# set audit-log                (a path or - for stdout; default: the XDG state home)
set audit-max-mb 10
set audit-daily false
set audit-files 3
set requests-audit 300

# --- the log surface ---
set log-level INFO
set log-access false

# --- the state dump (write-behind) ---
# set dump-path                (the dump file; needs setting for the dump to run)
set dump-with-cache false
# set dump-interval            (seconds between the automatic dumps; 0 = on request)
set restore-on-start false
