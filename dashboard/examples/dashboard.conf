# The dashboard's example configuration — GENERATED by
# scripts/gen_examples.py from dashboard/lib/options.json (the
# one-knob-one-source rows): every knob the registry declares is below — 39
# of them, every line commented. Edit the registry and re-run the generator,
# never this file. The docker image copies the file to
# /pv-suite/dashboard/dashboard.conf — its default --config target — where
# the CMD flags carry the bind; the compose stacks' PROM_URL and page token
# are compose-level environment. Copy the file, uncomment what you change.

# The grammar is the control grammar: every line is a `set <name> <value>` —
# the live path as words, the same line pastes into the console or a ctl —
# and every comment stays a comment. A value resolves flag > env > this file
# > the row's default: anything left commented falls to the default the line
# spells. A secret's line spells the file:<path> form — pass it as an
# owner-only 0600 file, never inline.

# upstream Prometheus URL
# set upstream http://localhost:9090

# path under which Prometheus is proxied
# set prom-prefix /prom

# directory to serve (startup-only: flag/env/config and restart)
# a secret — pass it as file:<path>, an owner-only 0600 file
# startup-only: a change applies on restart
# PATH
# set static-dir

# config.js to serve at /config.js (startup-only: flag/env/config and
# restart)
# a secret — pass it as file:<path>, an owner-only 0600 file
# startup-only: a change applies on restart
# PATH
# set config-js

# simultaneous client limit
# set max-clients 64

# disconnect clients silent for this long
# set client-timeout 300

# simultaneous connections from one peer IP
# no per-IP limit (the default)
# set max-conn-per-ip 0

# the metrics bind address HOST:PORT
# set metrics-listen 127.0.0.1:9353

# maximum concurrent /metrics clients; extras get an immediate 503, 0 =
# unlimited
# set metrics-max-clients 64

# seconds an idle /metrics client is kept before the socket times out, 0 =
# the built-in 5 s cap
# set metrics-client-timeout 5

# maximum concurrent /metrics connections from one peer IP, 0 = no per-IP
# limit
# no per-IP limit (the default)
# set metrics-max-conn-per-ip 0

# log the proxied Prometheus queries at INFO
# quiet (the default)
# set log-queries false

# --- system ---

# the daemon's own serving socket: the page's listen address

# listen address HOST:PORT
# startup-only: a change applies on restart
# set system listen 127.0.0.1:8080

# DEBUG-log the full output of every control command (plainly: the command
# and its status log)
# set system log-replies false

# log verbosity
# lifecycle, control commands, the upstream up/down flips
# set system log-level INFO

# log every HTTP request at INFO
# quiet (the default)
# set system log-access false

# log timestamps in the system time zone instead of UTC
# log timestamps in UTC (the default)
# set system local-time false

# --- auth ---

# the page's auth: the bearer token the browser presents — the
# `?auth=<token>` query bootstraps the session cookie

# require Authorization: Bearer <token> on the page, config.js and the proxy
# — mandatory beyond loopback; the `?auth=<token>` query bootstraps the
# session cookie; startup-only (pass it by flag/env/config); the value never
# renders back (`file:<path>` = the token from an owner-only file)
# a secret — pass it as file:<path>, an owner-only 0600 file
# startup-only: a change applies on restart
# set auth token file:/run/credentials/dashboard/auth-token

# --- control ---

# the control plane: the target, the tokens, the ops role's RBAC policy, the
# trusted peers

# control server target: unix socket path or TCP port on 127.0.0.1
# PATH|PORT
# set control port

# require a token on control connections: the client authenticates with
# {"cmd": "auth", "token":...}; over the unix socket a trusted peer (root,
# the daemon's own user or --control-trust-uids — SO_PEERCRED) skips the
# token (`file:<path>` = the token from an owner-only file)
# a secret — pass it as file:<path>, an owner-only 0600 file
# startup-only: a change applies on restart
# set control token file:/run/credentials/dashboard/control-token

# extra peer uids the unix control socket trusts without the token
# (SO_PEERCRED — a local systemd unit speaks without the secret); root and
# the daemon's own user are always trusted
# UID,...
# set control trust-uids

# leave the unix control socket group-accessible (chmod 0660 instead of the
# plain 0600)
# set control socket-group false

# --- control/ops ---

# the read-only ops role: the second token that scopes its sessions to the
# configured verbs (the default: show)

# a second, read-only control token: sessions authenticating with it may run
# its policy's verbs only (the default policy: show) (no set/clear, no
# request reload, no shutdown) — the ops shift against the admin key, both
# audited (`file:<path>` = the token from an owner-only file)
# a secret — pass it as file:<path>, an owner-only 0600 file
# startup-only: a change applies on restart
# set control ops token file:/run/credentials/dashboard/control-ops-token

# the read-only ops role's RBAC policy: the verbs its sessions may run,
# comma-separated
# set control ops verbs show

# --- metrics ---

# the dashboard's /metrics endpoint's auth and access: the bearer token the
# scrape presents and the client ACL checked at accept

# the tool's own Prometheus /metrics endpoint (needs a token beyond
# loopback; the address is --metrics-listen)
# no metrics endpoint (the default)
# set metrics enable false

# the metrics bearer token (Authorization: Bearer) — startup-only (pass it
# by flag/env/config); the value never renders back (`file:<path>` = the
# token from an owner-only file)
# a secret — pass it as file:<path>, an owner-only 0600 file
# startup-only: a change applies on restart
# set metrics token file:/run/credentials/dashboard/metrics-token

# clients allowed to connect to /metrics: "any", "none", comma-separated
# IPs/prefixes, or file:<path> (the ip-prefix acl file)
# every client may connect (the default)
# set metrics acl any

# --- audit ---

# the audit trail: the sink, the forwarding, the rotation, the kill switch

# the audit trail's file: a path, - for stdout, none = no local file (the
# forward carries the trail), empty = the XDG state home
# PATH|-|none
# set audit log-file

# also forward every audit line: the local syslog mirror or a remote
# collector (the off-box copy)
# set audit forward none

# the remote forward's envelope: RFC5424 (the default) or CEF — the local
# syslog forms keep the verbatim send
# the syslog envelope, the native line verbatim in the MSG
# set audit forward format rfc5424

# the audit lines' instance word: the writer daemon's identity — the control
# port when unset, the override when spelled
# ID
# set audit instance

# disable the audit trail entirely
# set audit disable false

# --- audit/rotate ---

# the audit trail's rotation: the size trigger, the UTC-midnight trigger and
# the backup count

# rotate the audit trail at this size in MB, keeping N backups; 0 = no size
# rotation
# set audit rotate max-size 10

# also rotate the audit trail at UTC midnight
# set audit rotate daily false

# rotated audit backups to keep
# set audit rotate files 3

# --- dump ---

# the state dump: the live overrides' file, the restore-on-start

# the state dump file: the live overrides, written on request dump, the
# graceful shutdown and every dump-interval
# <file>
# set dump path

# the key that seals the state dumps (the reload's state file too)
# (`file:<path>` reads an owner-only file)
# a secret — pass it as file:<path>, an owner-only 0600 file
# startup-only: a change applies on restart
# set dump key file:/run/credentials/dashboard/dump-key

# seconds between the automatic state dumps (the live setting overrides)
# set dump interval 0

# the dump loads on start (off: on demand with request restore)
# startup-only: a change applies on restart
# set dump restore-on-start false
