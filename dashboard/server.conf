# dashboard configuration — the control grammar (common/options.py):
# every line is a `set <name> <value>` in the CLI spelling, every comment
# stays a comment, and the whole file pipes through dashboard_ctl unchanged
# (or regenerates with the `show config` control command). The resolution
# order is flag > env > this file > the built-in defaults.

# what the dashboard serves and where
set port 8080
set bind 0.0.0.0
# set upstream http://prometheus:9090   (the stack's Prometheus; PROM_URL wins)
set prom-prefix /prom
# set static-dir                        (default: the packaged static/)
# set config-js                         (default: the packaged config.js)
set battery false

# the connection caps: the simultaneous-client and per-IP limits
set max-clients 64
set client-timeout 300
set max-conn-per-ip 0

# the control plane: the target, the tokens, the ops role's RBAC policy
# set control-port                      (unix path, TCP port on 127.0.0.1, or 0 = off)
# set control-token-file /run/credentials/dashboard/control-token
# set control-ops-token-file /run/credentials/dashboard/control-ops-token
set control-ops-verbs show,clear
# set control-trust-uids                (extra peer uids the unix socket trusts)

# the own Prometheus /metrics endpoint
set metrics-server false
set metrics-listen 127.0.0.1:9452
set metrics-max-clients 16
set metrics-client-timeout 5
set metrics-max-conn-per-ip 0

# the audit trail: the sink, the rotation, the kill switch
# set audit-log                         (a path or - for stdout; default: the XDG state home)
set audit-max-mb 10
set audit-files 3
set no-audit-log false

# the log surface
set log-level INFO
set log-queries false
set log-access false
set local-time false
