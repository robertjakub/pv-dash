[server]
port = 8080
bind = 0.0.0.0
upstream = http://localhost:9090
log_level = INFO
log_queries = false
; static_dir = static
; config_js = config.js
; the HTTP connection caps (0 = unlimited / off)
;max_clients = 64
;client_timeout = 300
;max_conn_per_ip = 0
; the JSON-lines control server (dashboard_ctl / dashboard_cli): a unix socket
; path (the default is /tmp/dashboard-<port>.socket), a TCP port on 127.0.0.1
; (a token is mandatory there), or 0 = off
;control_port =
; a TCP control connection needs a token; with one configured the wire is
; HMAC-signed (the full sha256 of every frame, keyed by the token)
;control_token =
;control_token_file =
; extra peer uids the unix control socket trusts without the token
;control_trust_uids =
