# The pv-suite Modbus tools as compose services. The build contexts are
# ../inverter and ../cache; the shared profiles/ directory rides in as a
# named context. Run one service: docker compose up -d fake-inverter
# Run the stack:         docker compose up -d (inverter + cache + CLI image)
services:
  fake-inverter:
    build:
      context: ../inverter
      additional_contexts:
        profiles: ../profiles
    image: fake-inverter
    ports:
      - "5502:5502"
    restart: unless-stopped

  modbus-cache:
    build:
      context: ../cache
      additional_contexts:
        profiles: ../profiles
    image: modbus-cache
    ports:
      - "15502:15502"
    depends_on:
      - fake-inverter
    restart: unless-stopped
