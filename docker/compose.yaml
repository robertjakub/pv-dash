# The pv-suite Modbus tools as compose services. The build contexts are
# ../inverter, ../cache, ../scraper and ../dashboard; the Dockerfiles are
# this directory's Dockerfile.<daemon> files (dockerfile: ../docker/... —
# the subproject contexts carry no Dockerfile of their own); the shared
# profiles/ directory, the entrypoint and the common/ package ride in as
# named contexts. Run one service: docker compose up -d fake-inverter
# Run the stack:         docker compose up -d (inverter + cache + scraper + prometheus + dashboard)
#
# All three share the external `config` volume mounted at /config: on start
# the entrypoint seeds it with the REQUIRED file artifacts (the generated
# metrics token, the JSON specs, the dashboard's config.js — never the
# bundled conf scripts: each tool loads the image's own conf and the
# per-tool env file overrides it). Edits to /config survive container
# recreation. `docker compose exec` sessions bypass the entrypoint and run
# as root; add --user pvsuite to land as pvsuite.
#
# Nothing else is published on the host (the audit's F7): the services talk
# over one `internal: true` network — no host ports, no outbound route. The
# one exception is the dashboard's HTTP port, loopback-only: the front for
# the stack's internal Prometheus (its /prom proxy -> http://prometheus:9090).
# The Modbus listeners and the exporter's /metrics stay reachable only from
# inside that network: `docker compose exec`, or a collector container
# attached to the same network by name (see README.md).
#
# The scraper/token story ships in the stack: the exporter serves with a
# bearer token (AUTH_TOKEN=file:/config/metrics.token — a random
# value the entrypoint generates on the first seed, 0600, owner pvsuite) and
# the Prometheus service reads its copy of the same file from the config
# volume. Read the token: docker compose exec modbus-scraper cat /config/metrics.token
#
# The overrides: per-tool env files — cp env/<tool>.env.example
# env/<tool>.env and edit (bare env-twin names; required: false, so no
# file = the image defaults). The SAME files serve plain
# `docker run --env-file` runs. See README.md.
services:
  fake-inverter:
    build:
      context: ../inverter
      dockerfile: ../docker/Dockerfile.fake-inverter
      additional_contexts:
        profiles: ../profiles
        scripts: ../docker
        common: ../common
    image: fake-inverter
    env_file:
      - path: env/fake.env
        required: false
    volumes:
      - config:/config
    networks:
      - modbus
    restart: unless-stopped

  modbus-cache:
    build:
      context: ../cache
      dockerfile: ../docker/Dockerfile.modbus-cache
      additional_contexts:
        profiles: ../profiles
        scripts: ../docker
        common: ../common
    image: modbus-cache
    env_file:
      - path: env/cache.env
        required: false
    volumes:
      - config:/config
    networks:
      - modbus
    depends_on:
      - fake-inverter
    restart: unless-stopped

  modbus-scraper:
    build:
      context: ../scraper
      dockerfile: ../docker/Dockerfile.modbus-scraper
      additional_contexts:
        profiles: ../profiles
        scripts: ../docker
        common: ../common
    image: modbus-scraper
    environment:
      # the token the entrypoint generated into the volume (0600, pvsuite):
      # the demo exporter never serves unauthenticated (the audit's F13) —
      # environment beats env_file, so scraper.env cannot override this;
      # the value is a file: reference (the first line of the 0600 file)
      AUTH_TOKEN: file:/config/metrics.token
    env_file:
      - path: env/scraper.env
        required: false
    networks:
      - modbus
    depends_on:
      - modbus-cache
    restart: unless-stopped

  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    image: prometheus
    env_file:
      - path: env/prometheus.env
        required: false
    volumes:
      - config:/config:ro
      - prometheus-data:/prometheus
    networks:
      - modbus
    depends_on:
      - modbus-scraper
    restart: unless-stopped

  dashboard:
    build:
      context: ../dashboard
      dockerfile: ../docker/Dockerfile.dashboard
      additional_contexts:
        scripts: ../docker
        common: ../common
    image: dashboard
    environment:
      # the proxy target: the stack's internal Prometheus service (the
      # dashboard never needs the token — the scrape stays prometheus-side;
      # there is no dashboard env_file — the stack's PROM_URL is a
      # compose-level concern, see env/dashboard.env.example for the
      # plain-docker spelling)
      PROM_URL: http://prometheus:9090
    volumes:
      - config:/config
    networks:
      - modbus
    ports:
      # the stack's one published port, loopback-only (the audit's F7
      # discipline: an explicit operator act, not reachable from the LAN)
      - "127.0.0.1:8080:8080"
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  modbus:
    name: pv-modbus
    internal: true

volumes:
  config:
  prometheus-data:
