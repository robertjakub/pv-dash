# The pv-suite Modbus tools as compose services — the DEMO stack: the fake
# inverter wired end to end on one internal network. The build contexts are
# ../../inverter, ../../cache, ../../scraper and ../../dashboard; the
# Dockerfiles are the parent directory's Dockerfile.<daemon> files
# (dockerfile: ../../docker/... from the subproject context — the subproject
# contexts carry no Dockerfile of their own; compose resolves the
# dockerfile relative to the context); the entrypoint
# and the common/ package + shared/ ride in as named contexts. The production shape
# (real device, the three services + your external collector) is the sibling
# prod/ stack — see ../README.md.
# Run one service: docker compose up -d modbus-fake-inverter
# Run the stack:         docker compose up -d (the fake + the cache + the scraper + prometheus + the dashboard)
#
# BEFORE up: generate the stack's three secrets —
#     sh ../gen-secrets.sh secrets
# (the suite key + the two bearer tokens, 0600 files under demo/secrets/
# — gitignored). The stack refuses to start without them: the files are
# compose secrets (file: sources), mounted read-only at
# /run/secrets/<name>, and the entrypoint stages a private 0600 copy for
# the unprivileged user at /run/pv-secrets/<name> — the path the file:
# env pins below speak. The secrets live OUTSIDE the config volume
# (docs/SECURITY.md F17 closed): the volume carries only the non-secret
# file artifacts. Rotation: delete the file, re-run gen-secrets.sh,
# recreate the service.
#
# The services share the `config` volume mounted at /config: on start
# the entrypoint seeds it with the REQUIRED non-secret file artifacts
# (the JSON specs, the dashboard's
# config.js — never the bundled conf scripts: each tool loads the image's
# own conf and the per-tool env file overrides it). Edits to /config
# survive container recreation. `docker compose exec` sessions bypass the
# entrypoint and run as root; add --user pvsuite to land as pvsuite.
#
# Nothing else is published on the host (the audit's F7): the services talk
# over one `internal: true` network — no host ports, no outbound route. The
# one exception is the dashboard's HTTP port, loopback-only: the front for
# the stack's internal Prometheus (its /prom proxy -> http://prometheus:9090).
# The Modbus listeners and the exporter's /metrics stay reachable only from
# inside that network: `docker compose exec`, or a collector container
# attached to the same network by name (see README.md).
#
# The scraper/token story ships in the stack: the exporter serves with a
# bearer token (AUTH_TOKEN=file:/run/pv-secrets/metrics-token — the
# operator's secret, 0600) and the Prometheus service reads the same
# secret (its entrypoint copies it 0600 for the unprivileged prometheus
# user). Read the token: cat secrets/metrics-token
# The dashboard's page ships token'd the same way (F21):
# cat secrets/page-token
#
# The Modbus hops ship authenticated the same way: one shared suite key
# (the operator's modbus-auth secret) proven by the PVA1/HMAC handshake on
# every connect — modbus-fake-inverter demands it (its server side), the
# cache proves it upstream and demands it from its own clients, the
# scraper proves it. The environment: blocks pin the scheme + the file:
# reference; environment beats env_file, so the per-tool env files cannot
# override the stack's auth story — opening a hop is a compose edit (an
# explicit operator act, the F7 shape).
#
# The overrides: per-tool env files — cp ../env/<tool>.env.example
# ../env/<tool>.env and edit (bare env-twin names; required: false, so no
# file = the image defaults). The SAME files serve plain
# `docker run --env-file` runs. See ../README.md.
secrets:
  modbus-auth:
    file: ./secrets/modbus-auth
  metrics-token:
    file: ./secrets/metrics-token
  page-token:
    file: ./secrets/page-token
services:
  modbus-fake-inverter:
    build:
      context: ../../apps/inverter
      dockerfile: ../../docker/Dockerfile.modbus-fake-inverter
      additional_contexts:
        scripts: ..
        common: ../../common
        shared: ../../shared
        cli: ../../apps
    image: modbus-fake-inverter
    environment:
      # the server side: every client proves the stack's suite key right
      # after connect — ERR and the client is dropped
      MODBUS_AUTH: suite
      MODBUS_AUTH_KEY: file:/run/pv-secrets/modbus-auth
    env_file:
      - path: ../env/modbus-fake-inverter.env
        required: false
    secrets:
      - modbus-auth
    volumes:
      - config:/config
    networks:
      - modbus
    restart: unless-stopped

  modbus-cache:
    build:
      context: ../../apps/cache
      dockerfile: ../../docker/Dockerfile.modbus-cache
      additional_contexts:
        scripts: ..
        common: ../../common
        shared: ../../shared
        cli: ../../apps
        examples: ../../extras/examples
    image: modbus-cache
    environment:
      # the upstream side: the cache proves the same suite key to the fake
      MODBUS_UPSTREAM_AUTH: suite
      MODBUS_UPSTREAM_AUTH_KEY: file:/run/pv-secrets/modbus-auth
      # the server side: the scraper (any client) proves it to the cache
      MODBUS_AUTH: suite
      MODBUS_AUTH_KEY: file:/run/pv-secrets/modbus-auth
    env_file:
      - path: ../env/modbus-cache.env
        required: false
    secrets:
      - modbus-auth
    volumes:
      - config:/config
    networks:
      - modbus
    depends_on:
      - modbus-fake-inverter
    restart: unless-stopped

  modbus-scraper:
    build:
      context: ../../apps/scraper
      dockerfile: ../../docker/Dockerfile.modbus-scraper
      additional_contexts:
        scripts: ..
        common: ../../common
        shared: ../../shared
        cli: ../../apps
    image: modbus-scraper
    environment:
      # the client side: the scraper proves the stack's suite key to the
      # cache on every connect (the poller keeps retrying on ERR)
      MODBUS_AUTH: suite
      MODBUS_AUTH_KEY: file:/run/pv-secrets/modbus-auth
      # the operator's bearer secret (0600, staged by the entrypoint):
      # the exporter never serves unauthenticated (the audit's F13) —
      # environment beats env_file, so modbus-scraper.env cannot override
      # this; the value is a file: reference (the first line of the 0600
      # file)
      AUTH_TOKEN: file:/run/pv-secrets/metrics-token
    env_file:
      - path: ../env/modbus-scraper.env
        required: false
    secrets:
      - modbus-auth
      - metrics-token
    volumes:
      - config:/config
    networks:
      - modbus
    depends_on:
      - modbus-cache
    restart: unless-stopped

  prometheus:
    build:
      context: ..
      dockerfile: Dockerfile.prometheus
      additional_contexts:
        alerts: ../../extras/alerts
    image: prometheus
    env_file:
      - path: ../env/prometheus.env
        required: false
    secrets:
      - metrics-token
    volumes:
      - prometheus-data:/prometheus
    networks:
      - modbus
    depends_on:
      - modbus-scraper
    restart: unless-stopped

  dashboard:
    build:
      context: ../../apps/dashboard
      dockerfile: ../../docker/Dockerfile.dashboard
      additional_contexts:
        scripts: ..
        common: ../../common
        shared: ../../shared
        cli: ../../apps
    image: dashboard
    environment:
      # the proxy target: the stack's internal Prometheus service (the
      # dashboard never needs the token — the scrape stays prometheus-side;
      # there is no dashboard env_file — the stack's PROM_URL is a
      # compose-level concern, see ../env/dashboard.env.example for the
      # plain-docker spelling)
      PROM_URL: http://prometheus:9090
      # the page's auth (the audit's F21): the container binds every
      # interface so the published port reaches it — beyond loopback a
      # token is mandatory, the refusal is the F13 shape. The operator's
      # page secret (0600, staged by the entrypoint) carries it; read it:
      # cat secrets/page-token
      LISTEN: 0.0.0.0:8080
      AUTH_TOKEN: file:/run/pv-secrets/page-token
    secrets:
      - page-token
    volumes:
      - config:/config
    networks:
      - modbus
    ports:
      # the stack's one published port, loopback-only (the audit's F7
      # discipline: an explicit operator act, not reachable from the LAN)
      - "127.0.0.1:8080:8080"
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  modbus:
    name: pv-modbus
    internal: true

volumes:
  config:
  prometheus-data:
