# The pv-suite Modbus tools as compose services — the PRODUCTION shape:
# the real deployment against real hardware. The same three tool images
# the demo stack runs (the Dockerfiles are the parent directory's
# Dockerfile.<daemon> files; the entrypoint and the
# common/ package + shared/ ride in as named contexts) — only the wiring differs:
#
#   - NO fake inverter: the cache's UPSTREAM points at the real device
#   - NO in-stack Prometheus: the collector is YOURS, external — it pulls
#     /metrics from the exporter (the bearer token gates it); the
#     dashboard's /prom proxy points at it (PROM_URL below — edit)
#   - a NON-internal network: the cache dials the device on the LAN (the
#     demo's `internal: true` would cut the route out)
#
# The operator's decisions, before `docker compose up -d`:
#   1. cp ../env/modbus-cache.env.example
#      ../env/modbus-cache-production.env and set UPSTREAM — the file
#      is REQUIRED here (no required: false): the stack refuses to
#      start without it, because the image default
#      (modbus-fake-inverter:5502) only ever resolves in the demo. The
#      prod copy carries the -production name (the demo stack reads
#      ../env/modbus-cache.env) so one checkout can run both stacks. If
#      the device (or its gateway) speaks an auth scheme, set
#      MODBUS_UPSTREAM_AUTH=suite|waveshare and MODBUS_UPSTREAM_AUTH_KEY
#      in the same file — the upstream credential is the device's, the
#      env file is its edit surface (the stack's own hops are pre-wired
#      below and cannot be overridden from the env file — environment
#      beats env_file)
#   2. your collector's way in (see the scraper's ports: comment)
#   3. edit the dashboard's PROM_URL below — your collector's base URL
#
# The auth story ships in the stack, both planes:
#   - the Modbus hops: one shared suite key (modbus-auth.token, generated
#     into the volume on the first seed like the tokens) proven by the
#     PVA1/HMAC handshake on every connect — the cache proves it upstream
#     ONLY if the env file says so (the device decides), and demands it
#     from its own clients; the scraper proves it. Opening the cache's
#     server side is a compose edit (delete the AUTH block below — an
#     explicit operator act, the F7 shape)
#   - the metrics hop: the exporter serves with a bearer token
#     (AUTH_TOKEN=file:/config/metrics.token — a random value the
#     entrypoint generates on the first seed, 0600, owner pvsuite); your
#     collector reads its copy (an owner-only credentials_file, F12).
#     Read the token:
#     docker compose exec modbus-scraper cat /config/metrics.token
#   - the dashboard's page ships token'd the same way (F21):
#     docker compose exec dashboard cat /config/page.token
#
# The tokens ride the shared `config` volume; they survive container
# recreation. `docker compose exec` sessions bypass the entrypoint and
# run as root; add --user pvsuite to land as pvsuite. Edits to /config
# survive recreation. See ../README.md and README.md (the topology).
services:
  modbus-cache:
    build:
      context: ../../apps/cache
      dockerfile: ../../docker/Dockerfile.modbus-cache
      additional_contexts:
        scripts: ..
        common: ../../common
        shared: ../../shared
        cli: ../../apps
        examples: ../../extras/examples
    image: modbus-cache
    environment:
      # the server side: the scraper (any client) proves the stack's suite
      # key right after connect — ERR and the client is dropped. Delete
      # this block to run the cache's Modbus open (an explicit operator
      # act); the upstream side (MODBUS_UPSTREAM_AUTH*) stays the env file's —
      # the device's credential, see the header
      MODBUS_AUTH: suite
      MODBUS_AUTH_KEY: file:/config/modbus-auth.token
    env_file:
      # REQUIRED (no required: false): UPSTREAM is the operator's decision
      # — set it to the device's Modbus TCP HOST:PORT before up. The other
      # lines stay commented; the image defaults stand. The -production
      # name keeps the prod copy apart from the demo stack's
      # modbus-cache.env
      - ../env/modbus-cache-production.env
    volumes:
      - config:/config
    networks:
      - net
    restart: unless-stopped

  modbus-scraper:
    build:
      context: ../../apps/scraper
      dockerfile: ../../docker/Dockerfile.modbus-scraper
      additional_contexts:
        scripts: ..
        common: ../../common
        shared: ../../shared
        cli: ../../apps
    image: modbus-scraper
    environment:
      # the client side: the scraper proves the stack's suite key to the
      # cache on every connect (the poller keeps retrying on ERR)
      MODBUS_AUTH: suite
      MODBUS_AUTH_KEY: file:/config/modbus-auth.token
      # the token the entrypoint generated into the volume (0600, pvsuite):
      # the exporter never serves unauthenticated (the audit's F13) —
      # environment beats env_file, so modbus-scraper-production.env
      # cannot override this;
      # the value is a file: reference (the first line of the 0600 file)
      AUTH_TOKEN: file:/config/metrics.token
    env_file:
      # optional (required: false): no file = the image defaults stand —
      # the prod copy's name (the demo stack reads
      # ../env/modbus-scraper.env)
      - path: ../env/modbus-scraper-production.env
        required: false
    volumes:
      - config:/config
    networks:
      - net
    depends_on:
      - modbus-cache
    restart: unless-stopped
    ports:
      # the exporter's /metrics, loopback-only, for your EXTERNAL
      # collector (bearer token: cat the token file above; the collector
      # scrapes with authorization.credentials_file — an owner-only copy,
      # F12). A CONTAINER collector instead: delete this mapping and run
      # it attached to the `pv-suite` network (it scrapes
      # modbus-scraper:9350)
      - "127.0.0.1:9350:9350"

  dashboard:
    build:
      context: ../../apps/dashboard
      dockerfile: ../../docker/Dockerfile.dashboard
      additional_contexts:
        scripts: ..
        common: ../../common
        shared: ../../shared
        cli: ../../apps
    image: dashboard
    environment:
      # EDIT before up: your external collector's base URL (the
      # dashboard's /prom proxy target). The dashboard never needs the
      # collector's token — the scrape stays collector-side. There is no
      # dashboard env_file — the stack's PROM_URL is a compose-level
      # concern (see ../env/dashboard.env.example for the plain-docker
      # spelling)
      PROM_URL: http://prometheus:9090
      # the page's auth (the audit's F21): the container binds every
      # interface so the published port reaches it — beyond loopback a
      # token is mandatory, the refusal is the F13 shape. The entrypoint
      # materializes a random 0600 token into /config/page.token on the
      # first seed; read it: docker compose exec dashboard cat /config/page.token
      LISTEN: 0.0.0.0:8080
      AUTH_TOKEN: file:/config/page.token
    volumes:
      - config:/config
    networks:
      - net
    ports:
      # the one human surface, loopback-only (the audit's F7 discipline:
      # an explicit operator act, not reachable from the LAN)
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

networks:
  net:
    name: pv-suite
    # NOT internal: the cache dials the real device on the LAN. The
    # scraper's /metrics and the dashboard's HTTP are published
    # loopback-only above; nothing else leaves the network

volumes:
  config:
