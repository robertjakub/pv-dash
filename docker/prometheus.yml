# The demo Prometheus: scrapes the modbus-scraper exporter over the
# internal compose network with the bearer token from its compose secret
# (the operator-generated file mounted at /run/secrets/metrics-token;
# the entrypoint copies it to /etc/prometheus/metrics.token,
# 0600 — see entrypoint-prometheus.sh). The stack publishes nothing on
# the host (docs/SECURITY.md F7): the UI is reachable from inside the
# network only.
global:
  scrape_interval: 10s

# The alert rules pack ships at alerts/ (one file per watched exporter,
# the audit vocabulary's detection half — docs/SECURITY.md F16); the image
# bakes both files (Dockerfile.prometheus, the alerts build context).
rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: modbus-scraper
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics.token
    static_configs:
      - targets: ['modbus-scraper:9350']
