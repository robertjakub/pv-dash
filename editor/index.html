<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pv-suite registry editor</title>
<style>
  :root {
    --bg: #fbfbfd; --fg: #14161a; --mut: #63666e; --line: #e0e2e8;
    --acc: #0b62d6; --accbg: #d9e8fd; --warn: #8a5a00; --warnbg: #ffe9bd;
    --err: #c01a10; --errbg: #ffdcd8; --ok: #0f7a30; --canon: #7c1fd1;
    --canonbg: #f1e3ff; --chip: #e7e8ee; --soft: #454952;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 18px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
  }
  .mono, td.nm, td.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 12px 18px;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  header h1 { font-size: 22px; margin: 0 10px 0 0; font-weight: 700; }
  header h1 span { color: var(--acc); font-weight: 500; }
  #q {
    flex: 1 1 300px; max-width: 580px; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: 8px; font: inherit;
  }
  #q:focus { outline: 3px solid var(--accbg); border-color: var(--acc); }
  #count { color: var(--mut); white-space: nowrap; font-size: 16.5px; }
  button {
    font: inherit; padding: 7px 14px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; cursor: pointer; color: var(--fg);
  }
  button:hover { border-color: var(--acc); color: var(--acc); background: var(--accbg); }
  button.pri { background: var(--acc); border-color: var(--acc); color: #fff; }
  button.pri:hover { color: #fff; filter: brightness(1.1); }
  button:disabled { opacity: .45; cursor: default; }
  main { padding: 12px 18px 70px; }
  table { border-collapse: collapse; width: 100%; }
  thead th {
    text-align: left; font-size: 14px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--soft); border-bottom: 2px solid var(--line); padding: 8px 12px;
    position: sticky; top: 74px; background: var(--bg);
  }
  tbody td { border-bottom: 1px solid var(--line); padding: 8px 12px; vertical-align: top; }
  tbody tr:hover { background: var(--accbg); }
  td.help { color: var(--soft); font-size: 17px; max-width: 640px; }
  .chip {
    display: inline-block; border-radius: 5px; padding: 1px 8px;
    font-size: 14.5px; font-weight: 600; margin-right: 6px; white-space: nowrap;
  }
  .t-cache { background: #d9e8fd; color: #0b47a8; }
  .t-scraper { background: #d3f2dc; color: #0d6a2e; }
  .t-inverter { background: #ffe4c2; color: #9a4d00; }
  .t-dashboard { background: #fcd9ec; color: #a11670; }
  .t-shared { background: #ecd5ff; color: #6b21a8; }
  .s-sec { background: transparent; color: var(--mut); border: 1px solid var(--line); font-weight: 500; }
  .mark {
    font-size: 14px; border-radius: 4px; padding: 1px 6px; margin-right: 4px;
    background: var(--chip); color: var(--soft); font-weight: 600;
  }
  .mark.m-secret { background: #ffdcd8; color: #c01a10; }
  .mark.m-node { background: #d9e8fd; color: #0b47a8; }
  .mark.m-canon { background: #ecd5ff; color: #6b21a8; }
  button.ed { padding: 2px 10px; }
  button.ed.canon { color: var(--canon); background: var(--canonbg); border-color: #d8c2f5; }
  button.ed.canon:hover { color: var(--canon); border-color: var(--canon); filter: brightness(.97); }
  button.ed.canon .c { font-size: 11px; font-weight: 700; margin-left: 2px; }
  td.acts { white-space: nowrap; }
  #status {
    padding: 8px 18px; font-size: 17px; min-height: 1.5em; white-space: pre-wrap;
  }
  #status.err { color: var(--err); background: var(--errbg); }
  #status.warn { color: var(--warn); background: var(--warnbg); }
  #status.ok { color: var(--ok); }
  #lintout {
    margin: 0; padding: 12px 18px; background: #101216; color: #d6d6d6;
    font: 15.5px/1.55 ui-monospace, Menlo, monospace; max-height: 45vh; overflow: auto;
    white-space: pre-wrap; border-top: 1px solid var(--line);
  }
  #edit h2 { font-size: 21px; margin: 6px 0 14px; font-family: ui-monospace, Menlo, monospace; }
  #edit table.grid td, #edit table.grid th { border: 1px solid var(--line); padding: 7px 10px; }
  #edit table.grid th { position: static; text-transform: none; letter-spacing: 0; font-size: 16.5px; color: var(--fg); background: #eef0f5; }
  #edit table.grid th.canon { background: var(--canonbg); color: var(--canon); }
  #edit td.k { font-family: ui-monospace, Menlo, monospace; font-size: 16px; color: var(--soft); font-weight: 600; white-space: nowrap; }
  #edit input, #edit select, #edit textarea {
    font: 16px ui-monospace, Menlo, Consolas, monospace; width: 100%;
    border: 1px solid transparent; border-radius: 5px; padding: 4px 6px;
    background: transparent; color: var(--fg);
  }
  #edit input::placeholder, #edit textarea::placeholder { color: var(--mut); opacity: 1; }
  #edit textarea { resize: vertical; min-height: 2.4em; background: #fff; border-color: var(--line); }
  #edit input:hover, #edit select:hover { border-color: var(--line); background: #fff; }
  #edit input:focus, #edit select:focus, #edit textarea:focus {
    outline: none; border-color: var(--acc); background: #fff;
  }
  #edit input[readonly] { color: var(--fg); font-weight: 700; }
  #edit .changed { border-color: var(--acc) !important; background: var(--accbg) !important; }
  #edit .invalid { border-color: var(--err) !important; background: var(--errbg) !important; }
  #edit td.empty input, #edit td.empty select { color: var(--mut); }
  #editbar { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  #warnbox { margin-top: 14px; }
  #warnbox li { margin-bottom: 5px; }
  details.raw { margin-top: 16px; }
  details.raw summary { cursor: pointer; font-size: 16px; }
  details.raw pre {
    background: #101216; color: #d6d6d6; padding: 12px; border-radius: 8px;
    font: 15.5px/1.55 ui-monospace, Menlo, monospace; overflow: auto; max-height: 40vh;
  }
  footer {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg);
    border-top: 1px solid var(--line); padding: 7px 18px; font-size: 15px; color: var(--mut);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171b; --fg: #eceef1; --mut: #a6aab2; --line: #3a3e46;
      --accbg: #1e3a5f; --warnbg: #3d2f0e; --errbg: #4a1712; --chip: #26282e;
      --canonbg: #3a2160; --soft: #ccd0d6;
    }
    button, #edit textarea, #edit input:hover, #edit select:hover { background: #1d1f24; }
    #edit table.grid th { background: #1d1f24; }
    button.ed.canon { border-color: #5b3a8e; }
    .t-cache, .mark.m-node { background: #1e3a5f; color: #9ecbff; }
    .t-scraper { background: #1d4630; color: #8fe6ad; }
    .t-inverter { background: #4d3315; color: #ffc98a; }
    .t-dashboard { background: #4d1f3a; color: #ff9ed2; }
    .t-shared, .mark.m-canon { background: #3a2160; color: #d8b4fe; }
    .mark.m-secret { background: #4a1712; color: #ff9a8f; }
    #lintout, details.raw pre { background: #0a0b0d; }
  }
</style>
</head>
<body>
<header>
  <h1>pv-suite <span>registry editor</span></h1>
  <input id="q" type="search" placeholder="search the flattened name (tool, section, name)…  ( / )" autofocus>
  <span id="count"></span>
  <button id="reload">reload</button>
  <button id="lintbtn">lint</button>
</header>
<div id="status"></div>
<pre id="lintout" hidden></pre>
<main id="list"></main>
<main id="edit" hidden></main>
<footer>
  empty cell = the field is absent &nbsp;·&nbsp; type <span class="mono">""</span> for an empty string &nbsp;·&nbsp;
  <span class="mono">&lang;null&rang;</span> keeps a JSON null &nbsp;·&nbsp; renames and new rows stay a hand wave
</footer>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NULLMARK = '\u27e8null\u27e9';
let REG = null, ENT = [], CUR = null, EDITS = {};

async function api(path, body) {
  const r = await fetch(path, body === undefined ? undefined : {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  return r.json();
}

function status(msg, cls) {
  const el = $('#status');
  el.textContent = msg;
  el.className = cls || '';
}

async function load() {
  try {
    REG = await api('/api/registry');
  } catch (e) {
    status('cannot reach the API — start it with python3 editor/serve.py', 'err');
    return;
  }
  buildEnt();
  if ($('#edit').hidden) renderList(); else { renderList(); openEdit(CUR.sec, CUR.name, CUR.scope); }
}

function buildEnt() {
  const map = new Map();
  for (const tool of Object.keys(REG.files)) {
    const secs = REG.files[tool].sections;
    for (const sec of REG.sections) {
      const data = secs[sec];
      if (!data) continue;
      const add = (name, row) => {
        const k = sec + '\u0000' + name;
        let g = map.get(k);
        if (!g) { g = {sec, name, members: []}; map.set(k, g); }
        g.members.push({tool, row});
      };
      if (Array.isArray(data)) for (const row of data) add(row.name, row);
      else for (const k of Object.keys(data)) add(k, data[k]);
    }
  }
  ENT = [...map.values()];
}

const desc = r => typeof r === 'string' ? r : (r['setting-help'] || r.help || '');

function renderList() {
  const toks = $('#q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const rows = ENT.filter(g => {
    const hay = [g.sec, g.name].concat(g.members.map(m => m.tool)).join(' ').toLowerCase();
    return toks.every(t => hay.includes(t));
  });
  $('#count').textContent = rows.length + ' / ' + ENT.length + ' names';
  $('#list').innerHTML =
    '<table><thead><tr><th>flattened name</th><th>description</th><th></th></tr></thead><tbody>' +
    rows.map(rowHTML).join('') + '</tbody></table>';
}

function rowHTML(g) {
  const chips = g.members.map(m => '<span class="chip t-' + m.tool + '">' + m.tool + '</span>').join('');
  const uniq = [...new Set(g.members.map(m => desc(m.row)))];
  const drift = uniq.length > 1 ? '<span class="mark">drifts</span> ' : '';
  const marks = ['secret', 'hidden', 'restart', 'internal', 'node']
    .filter(k => g.members.some(m => typeof m.row !== 'string' && m.row[k]))
    .map(m => '<span class="mark m-' + m + '">' + m + '</span>').join('');
  const canon = g.members.some(m => typeof m.row === 'string') ? '<span class="mark m-canon">canon</span>' : '';
  return '<tr><td class="nm">' + chips + '<span class="chip s-sec">' + g.sec + '</span>' + esc(g.name) + '</td>' +
    '<td class="help">' + drift + marks + canon + ' ' + esc(uniq[0].slice(0, 160)) + '</td>' +
    '<td>' +
    (g.members.some(m => m.tool !== 'shared')
      ? '<button class="ed" data-scope="tools" data-sec="' + g.sec + '" data-name="' + esc(g.name) +
        '" title="edit the tools\' rows">&#9998;</button> ' : '') +
    (g.members.some(m => m.tool === 'shared')
      ? '<button class="ed canon" data-scope="canon" data-sec="' + g.sec + '" data-name="' + esc(g.name) +
        '" title="edit the canon block (shared/options-help.json)">&#9998;<span class="c">c</span></button>' : '') +
    '</td></tr>';
}

function findRow(tool, sec, name) {
  return (REG.files[tool].sections[sec] || []).find(r => r && r.name === name);
}

function openEdit(sec, name, scope) {
  scope = scope || 'tools';
  CUR = {sec, name, scope};
  EDITS = {};
  const cols = [];
  if (scope === 'canon') {
    const sdata = REG.files.shared.sections[sec] || {};
    if (Object.prototype.hasOwnProperty.call(sdata, name)) {
      const b = sdata[name];
      cols.push({tool: 'shared', row: b, str: typeof b === 'string'});
    }
  } else {
    for (const t of REG.tools) {
      const row = findRow(t, sec, name);
      if (row) cols.push({tool: t, row});
    }
  }
  const keys = [];
  for (const c of cols) if (!c.str) for (const k of Object.keys(c.row)) if (!keys.includes(k)) keys.push(k);
  if (cols.some(c => c.str) && !keys.includes(REG.section_field[sec])) keys.push(REG.section_field[sec]);
  const rank = REG.key_rank;
  keys.sort((a, b) => {
    const ia = rank.indexOf(a), ib = rank.indexOf(b);
    return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.localeCompare(b);
  });
  CUR.cols = cols;
  CUR.keys = keys;
  renderEdit();
  $('#list').hidden = true;
  $('#edit').hidden = false;
  $('#lintout').hidden = true;
}

function back() {
  CUR = null;
  $('#edit').hidden = true;
  $('#list').hidden = false;
  renderList();
  $('#q').focus();
}

function origVal(col, key) {
  if (col.str) return key === REG.section_field[CUR.sec] ? col.row : undefined;
  return col.row[key];
}

function kindOf(key, v) {
  if (key === 'name') return 'name';
  if (key === 'conv') return 'conv';
  if (v === undefined) return (key === 'values' || key === 'value-help') ? 'json' : 'text';
  if (typeof v === 'boolean') return 'bool';
  if (typeof v === 'number') return 'num';
  if (typeof v === 'object') return 'json';
  if (v === null) return 'nullmark';
  return 'text';
}

function cid(tool, key) { return 'c:' + tool + ':' + key; }

function cellHTML(col, key) {
  const v = origVal(col, key);
  const kind = kindOf(key, v);
  const id = cid(col.tool, key);
  const ph = ' placeholder="\u2014"';
  if (col.str && key !== REG.section_field[CUR.sec]) return '<input disabled value="">';
  if (kind === 'name') return '<input readonly value="' + esc(v) + '">';
  if (kind === 'bool') {
    const cur = v === undefined ? '' : String(v);
    return '<select data-kind="bool" id="' + id + '">' +
      [['', '(absent)'], ['true', 'true'], ['false', 'false']]
        .map(([x, l]) => '<option value="' + x + '"' + (x === cur ? ' selected' : '') + '>' + l + '</option>').join('') +
      '</select>';
  }
  if (kind === 'conv') {
    const cur = v || '';
    return '<select data-kind="conv" id="' + id + '">' +
      ['', 'str', 'int', 'float', 'bool']
        .map(x => '<option value="' + x + '"' + (x === cur ? ' selected' : '') + '>' + (x || '(absent)') + '</option>').join('') +
      '</select>';
  }
  if (kind === 'num') return '<input data-kind="num" type="number" step="any" id="' + id + '" value="' + (v === undefined ? '' : v) + '"' + ph + '>';
  if (kind === 'json') {
    return '<textarea data-kind="json" id="' + id + '" rows="2">' +
      esc(v === undefined ? '' : JSON.stringify(v, null, 1)) + '</textarea>';
  }
  if (kind === 'nullmark') return '<input data-kind="nullmark" id="' + id + '" value="' + NULLMARK + '" title="JSON null \u2014 clear to remove, type to replace">';
  return '<input data-kind="text" id="' + id + '" value="' + esc(v === undefined ? '' : v) + '"' + ph + '>';
}

function renderEdit() {
  const {sec, name, scope, cols, keys} = CUR;
  const paths = [...new Set(cols.map(c => REG.files[c.tool].path))].join(' + ');
  const head = '<tr><th>key</th>' + cols.map(c =>
    '<th class="' + (c.tool === 'shared' ? 'canon' : '') + '" title="' +
    esc(REG.files[c.tool].path) + '">' + esc(c.tool) + (c.str ? ' <span class="mark">bare string</span>' : '') + '</th>').join('') + '</tr>';
  const body = keys.map(k =>
    '<tr><td class="k">' + esc(k) + '</td>' + cols.map(c => {
      const v = origVal(c, k);
      const empty = v === undefined && !(c.str && k === REG.section_field[sec]);
      return '<td' + (empty ? ' class="empty"' : '') + '>' + cellHTML(c, k) + '</td>';
    }).join('') + '</tr>').join('');
  const raws = cols.map(c =>
    '<details class="raw"><summary class="mono">' + esc(c.tool) + '</summary><pre>' +
    esc(JSON.stringify(c.row, null, 2)) + '</pre></details>').join('');
  $('#edit').innerHTML =
    '<div id="editbar"><button id="backbtn">&larr; index</button>' +
    '<button id="savebtn" class="pri">save</button>' +
    '<span class="chip ' + (scope === 'canon' ? 't-shared">canon only' : 's-sec">tools only') + '</span>' +
    '<span class="mono" style="color:var(--mut)">' + esc(paths) + ' — ' + sec + '</span></div>' +
    '<h2><span class="tool">' + esc(sec) + ' / </span>' + esc(name) + '</h2>' +
    '<table class="grid"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>' +
    '<div id="warnbox"></div>' + raws;
  $('#backbtn').onclick = back;
  $('#savebtn').onclick = saveEdit;
  $('#edit').oninput = onCellEvent;
  $('#edit').onchange = onCellEvent;
}

function onCellEvent(ev) {
  const el = ev.target;
  if (!el.id || !el.id.startsWith('c:')) return;
  const parts = el.id.split(':');
  onCell(parts[1], parts.slice(2).join(':'), el);
}

function onCell(tool, key, el) {
  const col = CUR.cols.find(c => c.tool === tool);
  const orig = origVal(col, key);
  const kind = el.dataset.kind;
  let val = null, del = false, noop = false;
  if (kind === 'name') return;
  if (kind === 'bool' || kind === 'conv') {
    const t = el.value;
    if (t === '') { del = true; noop = orig === undefined; }
    else if (kind === 'bool') { val = t === 'true'; noop = orig === val; }
    else { val = t; noop = orig === val; }
  } else if (kind === 'num') {
    if (el.value === '') { del = true; noop = orig === undefined; }
    else {
      val = Number(el.value);
      if (Number.isNaN(val)) { el.classList.add('invalid'); return; }
      noop = orig === val;
    }
  } else if (kind === 'json') {
    const raw = el.value.trim();
    if (raw === '') { del = true; noop = orig === undefined; }
    else {
      try { val = JSON.parse(raw); } catch { el.classList.add('invalid'); return; }
      noop = JSON.stringify(val) === JSON.stringify(orig);
    }
  } else if (kind === 'nullmark') {
    if (el.value === '') { del = true; }
    else if (el.value === NULLMARK) { val = null; noop = orig === null; }
    else { val = el.value; }
  } else {
    if (el.value === '') { del = true; noop = orig === undefined; }
    else if (el.value === '""') { val = ''; noop = orig === ''; }
    else { val = el.value; noop = orig === val; }
  }
  el.classList.remove('invalid');
  el.classList.toggle('changed', !noop);
  const e = EDITS[tool] || (EDITS[tool] = {set: {}, del: []});
  if (noop) {
    delete e.set[key];
    e.del = e.del.filter(k => k !== key);
    return;
  }
  if (del) {
    delete e.set[key];
    if (!e.del.includes(key)) e.del.push(key);
  } else {
    e.del = e.del.filter(k => k !== key);
    e.set[key] = val;
  }
}

async function saveEdit() {
  if (document.querySelector('#edit .invalid')) { status('fix the invalid cells first', 'err'); return; }
  const edits = [];
  for (const [tool, e] of Object.entries(EDITS)) {
    const del = e.del.filter(k => !(k in e.set));
    if (Object.keys(e.set).length || del.length) edits.push({tool, section: CUR.sec, name: CUR.name, set: e.set, del});
  }
  if (!edits.length) { status('nothing changed', 'ok'); return; }
  const out = await api('/api/save', {edits});
  let msg, cls;
  if (!out.ok) {
    msg = 'save refused, the file(s) restored:\n' + out.errors.join('\n');
    cls = 'err';
  } else {
    msg = 'saved ' + out.saved.join(', ');
    cls = 'ok';
  }
  if (out.warnings.length) {
    const wb = $('#warnbox');
    if (wb) wb.innerHTML = '<details open><summary style="color:var(--warn)">lint warnings (' +
      out.warnings.length + ')</summary><ul>' +
      out.warnings.map(w => '<li class="mono" style="font-size:12px">' + esc(w) + '</li>').join('') + '</ul></details>';
    if (out.ok) { msg += ' \u2014 lint warnings: ' + out.warnings.length; cls = 'warn'; }
  }
  status(msg, cls);
  await load();
}

async function runLint() {
  const out = await api('/api/lint', {});
  const el = $('#lintout');
  el.hidden = false;
  el.textContent = out.text;
  status(out.ok ? 'lint clean' : 'lint findings', out.ok ? 'ok' : 'err');
}

$('#q').addEventListener('input', renderList);
$('#reload').addEventListener('click', () => load().then(() => status('reloaded', 'ok')));
$('#lintbtn').addEventListener('click', runLint);
$('#list').addEventListener('click', ev => {
  const b = ev.target.closest('button.ed');
  if (b) openEdit(b.dataset.sec, b.dataset.name, b.dataset.scope);
});
document.addEventListener('keydown', ev => {
  const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (ev.key === '/' && !typing) {
    ev.preventDefault();
    if ($('#edit').hidden) $('#q').focus();
  } else if (ev.key === 'Escape' && !$('#edit').hidden && !typing) {
    back();
  }
});
load();
</script>
</body>
</html>
