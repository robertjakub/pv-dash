# modbus-fake-inverter configuration — the control grammar (common/options.py):
# every line is a `set <name> <value>` in the CLI spelling — the live path
# as words, the same line pastes into the console or fake_ctl — and every
# comment stays a comment. The resolution order is flag > env > this file >
# the built-in defaults; anything left commented falls to its default. The
# flat dashed knob name (`set max-kwp 6`) reads too, for older files.

# the demo simulation: the array, the battery, the clock (the
# CHAOS/MAX_KWP/STRICT/TIME/TIME_SCALE envs are the same knobs' env twins
# and re-apply on SIGHUP)
set unit 1
# set max-kwp 6              (the PV array size in kWp; peak = 75 % of it)
# set battery-kwh 6.9        (the usable battery capacity)
# set time 12:00             (freeze the simulated clock HH:MM)
# set time-scale 1           (N times real time — a day per 24/N hours)
# set timezone utc           (utc or local)
# set static off             (constant demo values instead of the day simulation)
# set seed                   (the chaos RNG seed; default: random)

# the Modbus session: the serve address, the strictness, the clients
set system listen 127.0.0.1:5502
# set strict off             (exception 02 on undefined registers)
# set connect-acl any        (any, none, or a comma-separated IP/CIDR list)
# set max-clients 64
# set client-timeout 300
# set max-conn-per-ip 0

# the writes: FC05/06/15/16 land in the write overlay when on
# set write allow off

# the auth scheme the fake's Modbus clients must speak
# set modbus auth suite      (the crypt handshake; needs the key below)
# set modbus auth key file:/run/credentials/fake-inverter/auth-key

# the grid nominals the wander machines walk around
# set grid-voltage 230
# set grid-frequency 50

# the register-map profile: a bare name resolves in profiles/profiles/
# set profile sun2000

# the control plane: the target, the tokens, the ops role's RBAC policy,
# the trusted peers, the unix socket's group access
# set control port           (unix path, TCP port on 127.0.0.1, or 0 = off)
# set control token file:/run/credentials/fake-inverter/control-token
# set control ops token file:/run/credentials/fake-inverter/control-ops-token
# set control ops verbs show,clear
# set control trust-uids     (extra peer uids the unix socket trusts)
# set control socket-group off  (chmod 0660: a local group may speak)

# the own Prometheus /metrics endpoint
# set metrics enable off
# set metrics-listen 127.0.0.1:9352   (a token is mandatory beyond loopback)
# set metrics token file:/run/credentials/fake-inverter/metrics-token
# set metrics acl any
# set metrics-max-clients 64
# set metrics-client-timeout 5
# set metrics-max-conn-per-ip 0

# the audit trail: the sink, the rotation, the kill switch
# set audit log-file          (a path or - for stdout; default: the XDG state home)
# set audit rotate max-size 10
# set audit rotate daily off
# set audit rotate files 3
# set audit disable off

# the log surface: the verbosity
set log-level INFO

# the state dump: the live overrides' file, the restore-on-start
# set dump path              (the dump file; needs setting for the dump to run)
# set dump key               (seal the dumps: the state rides encrypted; restart to apply)
# set dump-interval          (seconds between the automatic dumps; 0 = on request)
# set dump restore-on-start off
