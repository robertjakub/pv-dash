[scraper]
host = 127.0.0.1
modbus_port = 5502
unit = 1
modbus_offset = 0
timeout = 3
pv_register = 32064
grid_register = 37113
scale = 1
grid_scale = 1
max_kwp = 6
max_grid_kw = 12
battery = false
battery_register = 37001
battery_soc_register = 37004
grid_positive_import = false
listen = 127.0.0.1:9350
interval = 10
log_level = INFO
# the JSON-lines control server (scraper_ctl / scraper_cli): a unix socket
# path (the default is /tmp/modbus-scraper-<listen-port>.socket), a TCP port
# on 127.0.0.1 (a token is mandatory there), or 0 = off
#control_port =
# a TCP control connection needs a token; with one configured the wire is
# HMAC-signed (the full sha256 of every frame, keyed by the token)
#control_token =
#control_token_file =
# extra peer uids the unix control socket trusts without the token
#control_trust_uids =
