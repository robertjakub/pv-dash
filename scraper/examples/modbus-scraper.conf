# The modbus-scraper's example configuration — GENERATED by
# scripts/gen_examples.py from scraper/lib/options.json (the
# one-knob-one-source rows): every knob the registry declares is below — 42
# of them, every line commented. Edit the registry and re-run the generator,
# never this file. The dev wrapper (`scraper/dev`) points --config here; the
# docker image copies the file to /pv-suite/scraper/modbus-scraper.conf —
# its default --config target — where the CMD flags and the env twins carry
# the deployment shape. Copy the file, uncomment what you change.

# The grammar is the control grammar: every line is a `set <name> <value>` —
# the live path as words, the same line pastes into the console or a ctl —
# and every comment stays a comment. A value resolves flag > env > this file
# > the row's default: anything left commented falls to the default the line
# spells. A secret's line spells the file:<path> form — pass it as an
# owner-only 0600 file, never inline.

# --- modbus ---

# the inverter Modbus settings

# the inverter Modbus endpoint
# set modbus upstream 127.0.0.1:5502

# Modbus unit ID
# set modbus unit 1

# added to register addresses
# set modbus offset 0

# the auth settings: the Modbus scheme the poll session speaks (modbus auth
# — suite or none) and the bearer token the metrics endpoint requires (auth
# token)
# no auth (the default)
# set modbus auth none

# the suite handshake's shared key, min 16 characters (`file:<path>` reads
# an owner-only file)
# a secret — pass it as file:<path>, an owner-only 0600 file
# startup-only: a change applies on restart
# set modbus auth key file:/run/credentials/modbus-scraper/auth-key

# Modbus connect/read timeout
# set modbus timeout 3

# seconds between consecutive device reads within a poll cycle
# set modbus read-delay 0.05

# device profile JSON: the registers the metrics read (a bare name resolves
# in profiles/profiles/)
# set modbus profile sun2000

# grid register positive when importing
# set modbus grid-positive-import false

# seconds between polls of the inverter
# set modbus interval 10

# --- metrics ---

# the Prometheus /metrics exposition: the listen address, the serving
# limits, the display caps, the bearer auth, the connect ACL, the spec and
# the prefix

# metrics spec JSON, sectioned: {inputs: {name: {help}}, metrics: {key:
# {profile?, expr?, when?, help, type?}}, scraper:...} — the metrics entries
# are register- (profile) or expression-fed (expr/when) over the declared
# inputs (show inputs), merged in memory over the built-in lib/metrics.json
# scraper_* block
# PATH|-
# set metrics filter

# the prefix on the profile- and compute-fed metric names
# set metrics prefix huawei

# clients allowed to connect to /metrics: "any", "none", comma-separated
# IPs/prefixes, or file:<path> (the ip-prefix acl file)
# every client may connect (the default)
# set metrics acl any

# --- metrics/caps ---

# the display caps the percentages clamp to: the PV array and the grid
# ceilings

# maximum PV array kWp
# set metrics caps max-pv 6

# maximum grid kW, either direction
# set metrics caps max-grid 12

# --- system ---

# the daemon's own serving socket: the listen address

# listen address HOST:PORT
# startup-only: a change applies on restart
# set system listen 127.0.0.1:9350

# log timestamps in the system time zone instead of UTC
# set system local-time false

# DEBUG-log the full output of every control command (plainly: the command
# and its status log)
# set system log-replies false

# log every HTTP request at INFO
# quiet (the default)
# set system log-access false

# log verbosity
# lifecycle, control commands, poll up/down
# set system log-level INFO

# --- metrics/limits ---

# the /metrics serving limits (the client caps and the idle timeouts)

# simultaneous HTTP clients on /metrics; extras get an immediate 503
# set metrics limits max-clients 64

# kick idle keep-alive HTTP clients after this long
# set metrics limits timeout 300

# simultaneous HTTP connections from one peer IP
# no per-IP limit (the default)
# set metrics limits max-conn-per-ip 0

# --- control ---

# the control plane: the tokens, the ops role's RBAC policy, the trusted
# peers

# JSON-lines control server target: unix socket path
# PATH|PORT
# set control port

# require a token on control connections: the client authenticates with
# {"cmd": "auth", "token":...}; over the unix socket a trusted peer (root,
# the daemon's own user or --control-trust-uids — SO_PEERCRED) skips the
# token (`file:<path>` = the token from an owner-only file)
# a secret — pass it as file:<path>, an owner-only 0600 file
# startup-only: a change applies on restart
# set control token file:/run/credentials/modbus-scraper/control-token

# extra peer uids the unix control socket trusts without the token
# (SO_PEERCRED — a local systemd unit speaks without the secret); root and
# the daemon's own user are always trusted
# UID,...
# set control trust-uids

# leave the unix control socket group-accessible (chmod 0660 instead of the
# plain 0600)
# set control socket-group false

# --- control/ops ---

# the read-only ops role: the second token that scopes its sessions to the
# configured verbs (the default: show)

# a second, read-only control token: sessions authenticating with it may run
# its policy's verbs only (the default policy: show) (no set/clear, no
# request poll now, no request reload, no restart, no shutdown) — the ops
# shift against the admin key, both audited (`file:<path>` = the token from
# an owner-only file)
# a secret — pass it as file:<path>, an owner-only 0600 file
# startup-only: a change applies on restart
# set control ops token file:/run/credentials/modbus-scraper/control-ops-token

# the read-only ops role's RBAC policy: the verbs its sessions may run,
# comma-separated
# set control ops verbs show

# --- metrics/auth ---

# the /metrics bearer auth: the token the exposition endpoint requires

# require Authorization: Bearer <token> on all requests — startup-only (pass
# it by flag/env/config); the value never renders back (`file:<path>` = the
# token from an owner-only file)
# a secret — pass it as file:<path>, an owner-only 0600 file
# startup-only: a change applies on restart
# set metrics auth token file:/run/credentials/modbus-scraper/auth-token

# --- audit ---

# the SCR audit trail: the sink, the forwarding, the rotation, the kill
# switch

# SCR audit trail: a file path or - for stdout (the docker/journald way);
# `none` = no local file (the forward carries the trail); default: the XDG
# state home (~/.local/state/modbus-scraper/audit.log)
# PATH|-|none
# set audit log-file

# also forward every audit line: the local syslog mirror or a remote
# collector (the off-box copy)
# set audit forward none

# the remote forward's envelope: RFC5424 (the default) or CEF — the local
# syslog forms keep the verbatim send
# the syslog envelope, the native line verbatim in the MSG
# set audit forward format rfc5424

# the audit lines' instance word: the writer daemon's identity — the control
# port when unset, the override when spelled
# ID
# set audit instance

# disable the SCR audit trail
# set audit disable false

# --- audit/rotate ---

# the audit trail's rotation: the size trigger and the backup count

# rotate the audit log at this size in MB, keeping N backups; 0 = no size
# rotation
# set audit rotate max-size 10

# also rotate the audit log at UTC midnight
# set audit rotate daily false

# rotated audit backups to keep
# set audit rotate files 3

# --- dump ---

# the state dump: the live overrides' file, the restore-on-start

# the state dump file: the live overrides, written on request dump, the
# graceful shutdown and every dump-interval
# <file>
# set dump path

# the key that seals the state dumps (the reload's state file too)
# (`file:<path>` reads an owner-only file)
# a secret — pass it as file:<path>, an owner-only 0600 file
# startup-only: a change applies on restart
# set dump key file:/run/credentials/modbus-scraper/dump-key

# seconds between the automatic state dumps (the live setting overrides)
# set dump interval 0

# the dump loads on start (off: on demand with request restore)
# startup-only: a change applies on restart
# set dump restore-on-start false
