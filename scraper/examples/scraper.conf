# modbus-scraper configuration — the control grammar (common/options.py):
# every line is a `set <name> <value>` in the CLI spelling, every comment
# stays a comment, and the whole file pipes through scraper_ctl unchanged
# (or regenerates with the `show config` control command). The resolution
# order is flag > env > this file > the built-in defaults.
# the inverter Modbus session: the endpoint, the unit id, the register-map
# offset, the timeout (the map itself — addresses, types, gains, function
# codes — comes from the device profile alone; `set modbus profile
# <file-or-name>` swaps it live)
set modbus upstream 127.0.0.1:5502
set modbus unit 1
set modbus offset 0
set modbus timeout 3
# set modbus profile sun2000   (a bare name resolves in profiles/profiles/)
# set metrics filter           (a spec JSON merged over the built-in lib/metrics.json scraper_* block; default: the bundled metrics.json — the metrics entries are register- or expression-fed over the declared inputs, show inputs)
# set metrics prefix huawei    (the prefix on the profile- and compute-fed names)

# the polled numbers: the DC wattage cap, the grid ceiling
# (the percentages the numbers feed clamp to these ceilings)
set caps max-pv 6
set caps max-grid 12
set modbus grid-positive-import false

# the /metrics exposition: the listen address, the poll interval
set system listen 127.0.0.1:9350
set metrics interval 10

# the serving limits: the simultaneous-client and per-IP caps, the idle kick
set metrics limits max-clients 64
set metrics limits timeout 300
set metrics limits max-conn-per-ip 0

# the control plane: the target, the tokens, the ops role's RBAC policy,
# the trusted peers, the unix socket's group access
# set control port             (unix path, TCP port on 127.0.0.1, or 0 = off)
# set control token file:/run/credentials/modbus-scraper/control-token
# set control ops token file:/run/credentials/modbus-scraper/control-ops-token
set control ops verbs show,clear
# set control trust-uids       (extra peer uids the unix socket trusts)
# set control socket-group on  (chmod 0660: a local group may speak)

# the /metrics bearer auth
# set metrics auth token file:/run/credentials/modbus-scraper/auth-token

# the audit trail: the sink, the rotation, the kill switch
# set audit log-file           (a path or - for stdout; default: the XDG state home)
set audit rotate max-size 10
set audit rotate files 3
set audit disable false

# the log surface: the verbosity
set system log-level INFO

# the state dump: the live overrides' file, the restore-on-start
# set dump path                (the dump file; needs setting for the dump to run)
# set dump key                 (seal the dumps: the state rides encrypted; restart to apply)
# set dump-interval            (seconds between the automatic dumps; 0 = on request)
set dump restore-on-start false
