# modbus-scraper configuration — the control grammar (common/options.py):
# every line is a `set <name> <value>` in the CLI spelling, every comment
# stays a comment, and the whole file pipes through scraper_ctl unchanged
# (or regenerates with the `show config` control command). The resolution
# order is flag > env > this file > the built-in defaults.
# the inverter Modbus session: the endpoint, the unit id, the register-map
# offset (the map itself — addresses, types, gains, function codes — comes
# from the device profile alone; `set profile <file-or-name>` swaps it live)
set modbus upstream 127.0.0.1:5502
set modbus unit 1
set modbus offset 0
# set profile sun2000          (a bare name resolves in profiles/profiles/)
# set metrics-spec             (a spec JSON merged over the built-in lib/metrics.json scraper_* block; default: the bundled metrics.json)
# set metric-prefix huawei     (the prefix on the profile- and compute-fed names)
set timeout 3

# the polled numbers: the DC wattage cap, the grid ceiling, the battery
set max-kwp 6
set max-grid-kw 12
set battery false
set grid-positive-import false

# the listen address
set listen 127.0.0.1:9350

# the connection caps: the simultaneous-client and per-IP limits
set max-clients 64
set client-timeout 300
set limits max-conn-per-ip 0

# the control plane: the target, the tokens, the ops role's RBAC policy
# set control-port             (unix path, TCP port on 127.0.0.1, or 0 = off)
# set control-token-file /run/credentials/modbus-scraper/control-token
# set control-ops-token-file /run/credentials/modbus-scraper/control-ops-token
set control-ops-verbs show,clear
# set control-trust-uids       (extra peer uids the unix socket trusts)

# the /metrics bearer token
# set auth-token-file /run/credentials/modbus-scraper/auth-token

# the audit trail: the sink, the rotation, the kill switch
# set audit-log                (a path or - for stdout; default: the XDG state home)
set audit-max-mb 10
set audit-files 3
set no-audit-log false

# the log surface: the poll interval and the verbosity
set interval 10
set log-level INFO
